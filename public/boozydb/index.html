<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BoozyDB — 100+ classic and modern cocktail recipes. Search by spirit, glass, method, or flavor.">
  <title>BoozyDB — Cocktail Recipes</title>
  <style>
    /* ── Tokens ──────────────────────────────────────────── */
    :root {
      --bg:      #0d0d0d;
      --bg2:     #131313;
      --card:    #191919;
      --border:  #252525;
      --fg:      #efefef;
      --dim:     #7a7a7a;
      --subtle:  #444;
      --accent:  #c9a961;
      --abg:     rgba(201,169,97,.12);
      --r:       12px;
      --rs:      8px;
      --shadow:  0 8px 28px rgba(0,0,0,.35);
    }
    [data-theme="light"] {
      --bg:      #f7f5f2;
      --bg2:     #eceae6;
      --card:    #fff;
      --border:  #dedad4;
      --fg:      #1a1a1a;
      --dim:     #666;
      --subtle:  #b0b0b0;
      --abg:     rgba(201,169,97,.1);
      --shadow:  0 8px 28px rgba(0,0,0,.1);
    }
    /* ── Terminal mode ───────────────────────────────────── */
    .tm {
      --bg:#111010; --bg2:#161514; --card:#1a1918;
      --border:#2e2b28; --fg:#d6c9a8; --dim:#7a7060;
      --subtle:#252220; --accent:#c9a961; --abg:rgba(201,169,97,.1);
    }
    .tm body { font-family:'Courier New',monospace; }
    /* ── Reset ───────────────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);color:var(--fg);
      min-height:100dvh;line-height:1.6;
      transition:background .3s,color .3s;
    }
    /* ── Nav ─────────────────────────────────────────────── */
    .nav{
      position:sticky;top:0;z-index:100;
      background:var(--bg);border-bottom:1px solid var(--border);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    }
    .nav-inner{
      max-width:1440px;margin:0 auto;padding:1rem 2rem;
      display:flex;align-items:center;gap:1.25rem;
    }
    .brand{
      font-size:1.3rem;font-weight:700;color:var(--accent);
      letter-spacing:-.3px;flex-shrink:0;cursor:pointer;
      border:none;background:none;font-family:inherit;
    }
    .tm .brand::after{content:' $';opacity:.55}
    .nav-search{flex:1;max-width:380px;position:relative}
    .search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
    #search{
      width:100%;padding:.6rem 1rem .6rem 2.2rem;
      background:var(--border);border:1px solid var(--border);
      border-radius:var(--rs);color:var(--fg);font-size:.9rem;
      font-family:inherit;transition:border-color .2s,box-shadow .2s;
    }
    #search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--abg)}
    #search::placeholder{color:var(--dim)}
    .nav-right{display:flex;align-items:center;gap:.5rem;margin-left:auto}
    .btn{
      background:none;border:1px solid var(--border);color:var(--fg);
      padding:.45rem .85rem;border-radius:var(--rs);cursor:pointer;
      font-size:.8rem;font-family:inherit;font-weight:500;
      display:flex;align-items:center;gap:.4rem;
      transition:border-color .2s,color .2s,background .2s;white-space:nowrap;
    }
    .btn:hover{border-color:var(--accent);color:var(--accent)}
    .btn-ghost{border-color:transparent}
    .btn-ghost:hover{background:var(--border);border-color:var(--border);color:var(--fg)}
    /* ── Main ────────────────────────────────────────────── */
    .main{max-width:1440px;margin:0 auto;padding:2rem}
    /* ── Filters ─────────────────────────────────────────── */
    .filters{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:1.75rem}
    .fl{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600;flex-shrink:0}
    .fbtn{
      background:none;border:1px solid var(--border);color:var(--dim);
      padding:.28rem .7rem;border-radius:20px;cursor:pointer;
      font-size:.75rem;font-family:inherit;font-weight:500;
      transition:all .2s;
    }
    .fbtn:hover{border-color:var(--accent);color:var(--accent)}
    .fbtn.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
    /* ── Gallery header ──────────────────────────────────── */
    .gh{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.4rem}
    .gh h1{font-size:1.75rem;font-weight:700;letter-spacing:-.5px}
    .cnt{color:var(--dim);font-size:.88rem}
    /* ── Grid ────────────────────────────────────────────── */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.2rem}
    /* ── Card ────────────────────────────────────────────── */
    .card{
      background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
      transition:border-color .2s,transform .2s,box-shadow .2s;
      color:inherit;text-decoration:none;-webkit-user-select:none;user-select:none;
    }
    .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
    .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .cg{
      height:148px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(155deg,var(--border) 0%,transparent 75%);
      border-bottom:1px solid var(--border);padding:1rem;
      position:relative;flex-shrink:0;
    }
    .cg svg{width:auto;height:112px;max-width:78px;color:var(--accent);
      filter:drop-shadow(0 4px 10px rgba(0,0,0,.22));transition:filter .2s}
    .card:hover .cg svg{filter:drop-shadow(0 6px 18px rgba(201,169,97,.28))}
    .mbadge{
      position:absolute;top:7px;right:7px;
      background:rgba(0,0,0,.52);backdrop-filter:blur(4px);
      border:1px solid rgba(255,255,255,.09);border-radius:5px;
      padding:2px 5px;font-size:.58rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.6);
    }
    [data-theme="light"] .mbadge{background:rgba(255,255,255,.78);border-color:rgba(0,0,0,.07);color:rgba(0,0,0,.5)}
    .glabel{
      position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
      font-size:.58rem;font-weight:600;text-transform:uppercase;
      letter-spacing:.8px;color:var(--dim);white-space:nowrap;
    }
    .cb{padding:.85rem 1rem;display:flex;flex-direction:column;gap:.38rem;flex:1}
    .cname{font-size:.93rem;font-weight:600;letter-spacing:-.2px;line-height:1.3}
    .cspirit{display:flex;align-items:center;gap:.38rem;font-size:.72rem;font-weight:600}
    .sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .ctags{display:flex;flex-wrap:wrap;gap:.22rem;margin-top:auto;padding-top:.2rem}
    .tag{
      display:inline-block;background:var(--border);color:var(--dim);
      padding:.14rem .42rem;border-radius:4px;font-size:.65rem;
      font-weight:600;text-transform:uppercase;letter-spacing:.35px;
    }
    /* ── Modal ───────────────────────────────────────────── */
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.68);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      z-index:200;display:flex;align-items:center;justify-content:center;
      padding:2rem;opacity:0;pointer-events:none;transition:opacity .2s;
    }
    .overlay.open{opacity:1;pointer-events:all}
    .modal{
      background:var(--bg2);border:1px solid var(--border);border-radius:16px;
      max-width:900px;width:100%;max-height:calc(100dvh - 4rem);
      overflow-y:auto;transform:scale(.97) translateY(12px);
      transition:transform .25s cubic-bezier(.2,0,.38,.9);
    }
    .overlay.open .modal{transform:scale(1) translateY(0)}
    .modal::-webkit-scrollbar{width:5px}
    .modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .mhdr{
      display:flex;align-items:flex-start;gap:1.5rem;padding:1.75rem;
      border-bottom:1px solid var(--border);
      position:sticky;top:0;background:var(--bg2);z-index:10;
    }
    .mglass{
      width:88px;height:116px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(155deg,var(--border) 0%,transparent 100%);
      border-radius:10px;border:1px solid var(--border);flex-shrink:0;
    }
    .mglass svg{width:auto;height:98px;max-width:68px;color:var(--accent);
      filter:drop-shadow(0 4px 16px rgba(0,0,0,.3))}
    .mglass pre{display:none;font-size:.38rem;line-height:1.2;color:var(--accent);
      font-family:monospace;white-space:pre;padding:4px}
    .tm .mglass svg{display:none}
    .tm .mglass pre{display:block}
    .minfo{flex:1;display:flex;flex-direction:column;gap:.7rem;min-width:0}
    .mtitle{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;line-height:1.2}
    .mpills{display:flex;flex-wrap:wrap;gap:.45rem}
    .pill{
      display:inline-flex;align-items:center;gap:.32rem;padding:.28rem .65rem;
      border-radius:20px;font-size:.75rem;font-weight:600;
      background:var(--border);color:var(--dim);
    }
    .pill.sp{border:1px solid;background:var(--abg)}
    .mtags{display:flex;flex-wrap:wrap;gap:.28rem}
    .mclose{
      background:var(--border);border:none;color:var(--fg);
      width:32px;height:32px;border-radius:var(--rs);cursor:pointer;
      font-size:.85rem;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:background .2s;
    }
    .mclose:hover{background:var(--subtle)}
    .mbody{display:grid;grid-template-columns:1fr 1fr}
    .mcol{padding:1.5rem 1.75rem}
    .mcol+.mcol{border-left:1px solid var(--border)}
    .ctitle{font-size:.67rem;font-weight:700;text-transform:uppercase;
      letter-spacing:1.2px;color:var(--dim);margin-bottom:.9rem}
    .irow{display:flex;align-items:baseline;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
    .irow:last-child{border-bottom:none}
    .iamt{color:var(--accent);font-weight:600;font-size:.82rem;min-width:52px;text-align:right;flex-shrink:0}
    .iname{color:var(--fg);font-size:.86rem}
    .srow{display:flex;gap:.8rem;padding:.6rem 0;border-bottom:1px solid var(--border);align-items:flex-start}
    .srow:last-child{border-bottom:none}
    .snum{
      width:21px;height:21px;border-radius:50%;background:var(--accent);color:#111;
      display:flex;align-items:center;justify-content:center;
      font-size:.66rem;font-weight:700;flex-shrink:0;
    }
    .stxt{font-size:.86rem;line-height:1.65;color:var(--fg)}
    .msrc{margin:0 1.75rem 1.75rem;padding:.8rem 1rem;background:var(--border);
      border-radius:var(--rs);border-left:3px solid var(--accent);
      font-size:.82rem;color:var(--dim)}
    /* ── Terminal table ──────────────────────────────────── */
    .ttable-wrap{display:none}
    .tm .grid{display:none}
    .tm .ttable-wrap{display:block}
    .ttable{width:100%;border-collapse:collapse;font-size:.8rem}
    .ttable th{color:var(--accent);text-align:left;padding:.28rem 1.5rem .28rem 0;
      border-bottom:1px solid var(--border);font-size:.68rem;text-transform:uppercase;letter-spacing:.8px}
    .ttable td{padding:.32rem 1.5rem .32rem 0;border-bottom:1px solid var(--border);color:var(--fg)}
    .ttable tr:hover td{background:var(--border);cursor:pointer}
    .ttable td:first-child{color:var(--accent);font-weight:600}
    .tprompt{margin-top:1rem;color:var(--accent);font-size:.85rem}
    .cur{display:inline-block;width:8px;height:13px;background:var(--accent);
      vertical-align:middle;animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    /* ── Toast ───────────────────────────────────────────── */
    .toast{
      position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(12px);
      background:var(--fg);color:var(--bg);padding:.6rem 1.2rem;border-radius:8px;
      font-size:.8rem;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;
      pointer-events:none;z-index:999;white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* ── Empty ───────────────────────────────────────────── */
    .empty{grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--dim);font-size:.95rem}
    /* ── Responsive ──────────────────────────────────────── */
    @media(max-width:860px){
      .mbody{grid-template-columns:1fr}
      .mcol+.mcol{border-left:none;border-top:1px solid var(--border)}
    }
    @media(max-width:680px){
      .nav-inner{flex-wrap:wrap;padding:.75rem 1rem}
      .nav-search{order:3;max-width:100%;flex:0 0 100%}
      .main{padding:1rem}
      .grid{grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:.75rem}
      .cg{height:130px}
      .cg svg{height:98px}
      .overlay{padding:0;align-items:flex-end}
      .modal{border-radius:16px 16px 0 0;max-height:91dvh}
      .mhdr{padding:1.2rem;gap:1rem}
      .mglass{width:70px;height:94px}
      .mglass svg{height:78px}
      .mtitle{font-size:1.3rem}
      .mcol{padding:1.2rem}
    }
    @media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <button class="brand" id="brand">BoozyDB</button>
    <div class="nav-search">
      <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="search" placeholder="Search cocktails, spirits, flavors…" autocomplete="off" spellcheck="false">
    </div>
    <div class="nav-right">
      <button class="btn" id="rnd-btn" title="Pick a random recipe">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.5 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.7l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
        Random
      </button>
      <button class="btn btn-ghost" id="theme-btn" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
</nav>

<main class="main">
  <div class="filters" id="filters"></div>
  <div class="gh">
    <h1>Cocktail Recipes</h1>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="grid" id="grid"></div>
  <!-- Terminal mode table -->
  <div class="ttable-wrap" id="ttable-wrap">
    <div id="twelcome" style="margin-bottom:1rem;font-size:.82rem;opacity:.7"></div>
    <table class="ttable" id="ttable">
      <thead><tr><th>NAME</th><th>SPIRIT</th><th>GLASS</th><th>METHOD</th><th>TAGS</th></tr></thead>
      <tbody id="ttbody"></tbody>
    </table>
    <div class="tprompt">&gt; <span class="cur"></span></div>
  </div>
</main>

<!-- Recipe modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal" id="modal">
    <div class="mhdr">
      <div class="mglass" id="mglass"></div>
      <div class="minfo" id="minfo"></div>
      <button class="mclose" id="mclose" aria-label="Close">✕</button>
    </div>
    <div class="mbody">
      <div class="mcol">
        <div class="ctitle">Ingredients</div>
        <div id="mings"></div>
      </div>
      <div class="mcol">
        <div class="ctitle">Instructions</div>
        <div id="msteps"></div>
      </div>
    </div>
    <div id="msrc"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

</svg>`,

  mug:`<svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">

  <path d="M 20 57 L 66 57 L 66 116 L 20 116 Z" fill="rgba(201,169,97,.28)"/>

  "julep cup":`<svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
  <path d="M 18 68 L 82 68 L 78 144 L 22 144 Z" fill="rgba(201,169,97,.24)"/>

  <line x1="14" y1="14" x2="86" y2="14" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
  <line x1="16" y1="40" x2="84" y2="40" stroke="currentColor" stroke-width=".6" opacity=".2"/>
  <line x1="17" y1="60" x2="83" y2="60" stroke="currentColor" stroke-width=".5" opacity=".15"/>
  <path d="M 28 25 L 35 16 M 42 22 L 46 14 M 56 22 L 60 14" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".3" stroke-linecap="round"/>

};
const GFALL = G.rocks;

/* ── ASCII glass art (terminal mode) ─────────────────────────────── */
const GASCII = {
  coupe:"  X---------X\n  |         |\n  |         |\n   \\       /\n    \\     /\n     \\   /\n      | |\n      | |\n      | |\n   X-----X",
  rocks:"X-----------X\n|           |\n|           |\n|           |\n|           |\n|           |\n|           |\n|           |\nXX         XX\nXXXXXXXXXXXXX",
  martini:"  X-------X\n   \\     /\n    \\   /\n     \\ /\n      |\n      |\n      |\n      |\n      |\n   X-----X",
  highball:"  X-------X\n  |       |\n  |       |\n  |       |\n  |       |\n  |       |\n  |       |\n  |       |\n  |       |\n  X-------X",
  flute:"   X-----X\n   |     |\n    \\   /\n     | |\n     | |\n     | |\n     | |\n     | |\n     | |\n   X-----X",
  "wine glass":"   X-----X\n   |     |\n    \\   /\n     \\ /\n      |\n      |\n      |\n      |\n      |\n   X-----X",
  mug:"  X-------X\n  |       |-X\n  |       | |\n  |       | |\n  |       |-X\n  |       |\n  |       |\n  X-------X",
  "julep cup":"  X---------X\n  |         |\n  |         |\n  |         |\n  |         |\n  |         |\n  |         |\n  X---------X",
};
const GAFALLBACK = "   _______\n  |       |\n  |       |\n  |       |\n  |_______|";

/* ── Spirit colors ───────────────────────────────────────────────── */
const SC = {
  whiskey:'#e8944a',bourbon:'#e8944a',rye:'#d4823e',scotch:'#c9783a',
  gin:'#6dbf8e',vodka:'#9bb8cc',rum:'#d4923e',tequila:'#d4c040',
  mezcal:'#b89050',brandy:'#c45c30',cognac:'#c45c30',
  wine:'#c44070',champagne:'#d4c060',prosecco:'#d4c060',
  beer:'#c4a040',aperol:'#e87030',campari:'#e84040',
  vermouth:'#88b460',amaro:'#8a6040',liqueur:'#9060c0',
  absinthe:'#60b040',pisco:'#d0c090','cachaça':'#c4a040',
};
function sc(spirit){ return SC[(spirit||'').toLowerCase()]||'#c9a961'; }

/* ── Helpers ─────────────────────────────────────────────────────── */
const ALIASES={tall:'highball','martini glass':'martini','irish coffee glass':'mug'};
function ng(g){ const s=(g||'').trim().toLowerCase(); return ALIASES[s]||s; }
function gsv(g){ return G[ng(g)]||GFALL; }
function gasc(g){ return GASCII[ng(g)]||GAFALLBACK; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function method(r){
  const tags=r.tags||[];
  const inst=(r.instructions||[]).join(' ').toLowerCase();
  for(const m of ['stirred','shaken','built','blended','rolled','thrown'])
    if(tags.includes(m)) return m;
  if(inst.includes('stir')) return 'stirred';
  if(inst.includes('shake')) return 'shaken';
  if(inst.includes('blend')) return 'blended';
  return null;
}

/* ── App state ───────────────────────────────────────────────────── */
let ALL=[], spirit='', q='', terminal=false;

/* ── Render grid ─────────────────────────────────────────────────── */
function filtered(){
  const sq=q.toLowerCase();
  return ALL.filter(r=>{
    if(spirit && r.spirit!==spirit) return false;
    if(sq && !r.name.toLowerCase().includes(sq)
          && !(r.spirit||'').toLowerCase().includes(sq)
          && !(r.tags||[]).some(t=>t.includes(sq))
          && !(r.glass||'').toLowerCase().includes(sq)) return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

function renderGrid(){
  const list=filtered();
  const total=ALL.length;
  document.getElementById('cnt').textContent=
    list.length===total?`${total} recipes`:`${list.length} of ${total}`;

  if(terminal){ renderTerminal(list); return; }

  if(!list.length){
    document.getElementById('grid').innerHTML='<div class="empty">No recipes match your search.</div>';
    return;
  }
  document.getElementById('grid').innerHTML=list.map(r=>{
    const m=method(r), c=sc(r.spirit), tags=(r.tags||[]).slice(0,3);
    const more=(r.tags||[]).length-tags.length;
    const gname=ng(r.glass||'');
    return `<div class="card" data-id="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)}">
      <div class="cg">
        ${m?`<span class="mbadge">${m}</span>`:''}
        ${gsv(r.glass)}
        ${gname?`<span class="glabel">${gname}</span>`:''}
      </div>
      <div class="cb">
        <div class="cname">${esc(r.name)}</div>
        ${r.spirit?`<div class="cspirit"><span class="sdot" style="background:${c}"></span><span style="color:${c}">${esc(r.spirit)}</span></div>`:''}
        ${tags.length?`<div class="ctags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${more>0?`<span class="tag">+${more}</span>`:''}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

/* ── Render terminal ─────────────────────────────────────────────── */
function renderTerminal(list){
  document.getElementById('twelcome').innerHTML=
    `BoozyDB v2.0.0 — cocktail recipe catalog<br>` +
    `Press <kbd style="background:var(--border);padding:1px 5px;border-radius:3px">\`</kbd> to exit terminal mode.<br>` +
    `<span style="opacity:.6">&gt; list${spirit?' --spirit '+spirit:''}${q?' --search "'+q+'"':''} (${list.length} results)</span>`;
  document.getElementById('ttbody').innerHTML=list.map(r=>
    `<tr data-id="${r.id}">
      <td>${esc(r.name)}</td>
      <td>${esc(r.spirit||'-')}</td>
      <td>${esc(ng(r.glass||''))}</td>
      <td>${esc(method(r)||'-')}</td>
      <td>${esc((r.tags||[]).slice(0,3).join(', '))}</td>
    </tr>`
  ).join('');
}

/* ── Render detail (modal) ───────────────────────────────────────── */
function renderDetail(r){
  const m=method(r), c=sc(r.spirit), g=ng(r.glass||'');
  const date=r.created_at?new Date(r.created_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'';

  document.getElementById('mglass').innerHTML=
    gsv(r.glass)+
    `<pre aria-hidden="true">${esc(gasc(r.glass))}</pre>`;

  document.getElementById('minfo').innerHTML=`
    <div class="mtitle" id="mtitle">${esc(r.name)}</div>
    <div class="mpills">
      ${r.spirit?`<span class="pill sp" style="color:${c};border-color:${c}40;background:${c}18">
        <span style="width:7px;height:7px;border-radius:50%;background:${c};display:inline-block;flex-shrink:0"></span>
        ${esc(r.spirit)}
      </span>`:''}
      ${m?`<span class="pill">${m}</span>`:''}
      ${g?`<span class="pill">${g}</span>`:''}
      ${date?`<span class="pill">${date}</span>`:''}
    </div>
    ${(r.tags||[]).length?`<div class="mtags">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
  `;

  document.getElementById('mings').innerHTML=
    (r.ingredients||[]).map(i=>
      `<div class="irow">
        <span class="iamt">${esc((i.amount+' '+i.unit).trim()||'—')}</span>
        <span class="iname">${esc(i.item)}</span>
      </div>`
    ).join('')||'<p style="color:var(--dim);font-size:.85rem">No ingredients listed.</p>';

  document.getElementById('msteps').innerHTML=
    (r.instructions||[]).map((s,i)=>
      `<div class="srow">
        <span class="snum">${i+1}</span>
        <span class="stxt">${esc(s)}</span>
      </div>`
    ).join('')||'<p style="color:var(--dim);font-size:.85rem">No instructions listed.</p>';

  document.getElementById('msrc').innerHTML=r.source
    ?`<div class="msrc"><strong>Source:</strong> ${esc(r.source)}</div>`:'';
}

/* ── Modal open/close ────────────────────────────────────────────── */
function openModal(id){
  const r=ALL.find(x=>x.id===id);
  if(!r) return;
  renderDetail(r);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
  history.replaceState(null,'','#/recipe/'+id);
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  history.replaceState(null,'','#/');
}

/* ── Terminal toggle ─────────────────────────────────────────────── */
function toggleTerminal(){
  terminal=!terminal;
  document.documentElement.classList.toggle('tm', terminal);
  showToast(terminal?'Terminal mode — press ` to exit':'Welcome back 🍹');
  renderGrid();
}

/* ── Toast ───────────────────────────────────────────────────────── */
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2400);
}

/* ── Spirit filter buttons ───────────────────────────────────────── */
function buildFilters(){
  const spirits=[...new Set(ALL.map(r=>r.spirit).filter(Boolean))].sort();
  document.getElementById('filters').innerHTML=
    `<span class="fl">Spirit</span>
     <button class="fbtn on" data-s="">All</button>
     ${spirits.map(s=>`<button class="fbtn" data-s="${esc(s)}">${esc(s)}</button>`).join('')}`;
}

/* ── Routing ─────────────────────────────────────────────────────── */
function handleRoute(){
  const h=location.hash;
  if(h.startsWith('#/recipe/')){
    const id=h.slice(9);
    if(ALL.length) openModal(id);
    else pendingId=id;
  }
}
let pendingId=null;

/* ── Init ────────────────────────────────────────────────────────── */
async function init(){
  try{
    const res=await fetch('recipes.json');
    if(!res.ok) throw new Error(res.status);
    ALL=await res.json();
  } catch(e){
    document.getElementById('grid').innerHTML=
      '<div class="empty">Could not load recipes.json.<br>Run <code>python build.py</code> first.</div>';
    return;
  }
  buildFilters();
  renderGrid();
  if(pendingId){ openModal(pendingId); pendingId=null; }
}

/* ── Events ──────────────────────────────────────────────────────── */
// Card click (grid + terminal table)
document.addEventListener('click',e=>{
  const card=e.target.closest('.card,[data-id]');
  if(card && document.getElementById('grid').contains(card)) openModal(card.dataset.id);
  const row=e.target.closest('#ttbody tr');
  if(row) openModal(row.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    const c=e.target.closest('.card');
    if(c){e.preventDefault();openModal(c.dataset.id);}
  }
  if(e.key==='Escape') closeModal();
  if(e.key==='`'&&!e.ctrlKey&&!e.metaKey&&e.target.tagName!=='INPUT') toggleTerminal();
});

document.getElementById('mclose').addEventListener('click',closeModal);
document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('overlay')) closeModal();
});

document.getElementById('search').addEventListener('input',e=>{
  q=e.target.value;
  renderGrid();
});

document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.fbtn');
  if(!b) return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  spirit=b.dataset.s;
  renderGrid();
});

document.getElementById('rnd-btn').addEventListener('click',()=>{
  const list=filtered();
  if(list.length) openModal(list[Math.floor(Math.random()*list.length)].id);
});

document.getElementById('brand').addEventListener('click',()=>{
  closeModal();
  document.getElementById('search').value='';
  q='';spirit='';
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  document.querySelector('.fbtn[data-s=""]')?.classList.add('on');
  renderGrid();
});

// Theme
const saved=localStorage.getItem('bdb-theme')||'dark';
document.documentElement.setAttribute('data-theme',saved);
document.getElementById('theme-btn').textContent=saved==='dark'?'🌙':'☀️';
document.getElementById('theme-btn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nxt=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nxt);
  document.getElementById('theme-btn').textContent=nxt==='dark'?'🌙':'☀️';
  localStorage.setItem('bdb-theme',nxt);
});

window.addEventListener('hashchange',handleRoute);
handleRoute();
init();
</script>
</body>
</html>
